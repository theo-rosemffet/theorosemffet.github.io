<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dgsufjhl9/image/upload/v1770753640/favicon_xy57kz.png">
    <title>Theo Rosemffet | Visual & Technical Artist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* HIDE DEFAULT CURSOR */
        html, body, a, button {
            cursor: none !important;
        }

        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Helvetica', 'Arial', sans-serif; 
            font-weight: 900; 
            overflow: hidden; /* No scrolling */
        }

        /* CUSTOM SCOPE CURSOR */
        .cursor-scope {
            width: 32px;
            height: 32px;
            border: 2px solid white;
            border-radius: 2px;
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Centering + Rotation */
            transform: translate(-50%, -50%) rotate(0deg);
            /* Easing: width/height smooth, transform springy */
            transition: 
                width 0.3s ease, 
                height 0.3s ease, 
                transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Center dot of the scope */
        .cursor-scope::after {
            content: '';
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
        }

        /* Hover State: Rotates 45 degrees and grows */
        .cursor-hover {
            width: 48px;
            height: 48px;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        /* VIDEO BACKGROUND */
        #video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 0;
            backdrop-filter: blur(2px); 
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed; 
            top: 0; left: 0;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px;
            width: 400px;
        }

        header { margin-bottom: 60px; }
        h1 { font-size: 2.5rem; text-transform: uppercase; line-height: 1; letter-spacing: -1px; }
        .tagline { font-size: 1.2rem; text-transform: none; font-weight: 400; color: #eee; margin-top: 5px; }

        nav ul { list-style: none; }
        nav li { margin-bottom: 20px; }
        nav a { 
            color: #fff; 
            text-decoration: none; 
            font-size: 2.5rem; 
            text-transform: uppercase; 
            display: inline-block;
        }

        /* UPDATED STROBE EFFECT */
        nav a:hover {
            animation: strobe 0.1s steps(2) infinite;
            padding-left: 10px;
            background: none; 
        }

        @keyframes strobe {
            0% { color: #fff; }
            49% { color: #fff; }
            50% { color: #000; } 
            99% { color: #000; }
            100% { color: #fff; }
        }

        /* CONTENT AREA */
        .content {
            position: relative;
            z-index: 5;
            margin-left: 400px;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .sidebar { position: relative; width: 100%; height: auto; }
            .content { margin-left: 0; height: auto; }
            body { overflow: auto; }
            .cursor-scope { display: none; } /* Custom cursors are bad on mobile */
            * { cursor: auto !important; }
        }

        .audio-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: none; /* Inherits from global, but explicit just in case */
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        .audio-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="cursor-scope"></div>
    
    <video autoplay muted loop playsinline id="video-bg">
        <source src="https://res.cloudinary.com/dgsufjhl9/video/upload/v1771614720/Post_Razzmataz_PERGO_ANL_newnew_ks8pds.mp4" type="video/mp4">
    </video>
    
    <button id="music-toggle" class="audio-button">
      <span id="speaker-icon">🔈</span>
    </button>
    
    <div class="overlay"></div>

    <div class="sidebar">
        <header>
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>Theo Rosemffet</h1>
            </a>
            <p class="tagline">Visual & Technical Artist</p>
        </header>

        <nav>
            <ul>
                <li><a href="bio.html">BIO</a></li>
                <li><a href="works.html">WORKS</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </div>

    <main class="content">
    </main>

    <script>
      const video = document.getElementById('video-bg');
      const btn = document.getElementById('music-toggle');
      const icon = document.getElementById('speaker-icon');
      const cursor = document.querySelector('.cursor-scope');
    
      // Audio Toggle Logic
      btn.addEventListener('click', () => {
        if (video.muted) {
          video.muted = false;
          icon.innerText = '🔊';
          video.play(); 
        } else {
          video.muted = true;
          icon.innerText = '🔈';
        }
      });

      // Cursor Follow Logic
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });

      // Cursor Hover Logic (Rotate & Expand)
      const interactables = document.querySelectorAll('a, button');
      interactables.forEach(item => {
        item.addEventListener('mouseenter', () => cursor.classList.add('cursor-hover'));
        item.addEventListener('mouseleave', () => cursor.classList.remove('cursor-hover'));
      });
    </script>    
</body>
</html>
